name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-macos
            asset: hitch-aarch64-macos
          - os: macos-latest
            target: x86_64-macos
            asset: hitch-x86_64-macos
          - os: ubuntu-latest
            target: aarch64-linux-musl
            asset: hitch-aarch64-linux
          - os: ubuntu-latest
            target: x86_64-linux-musl
            asset: hitch-x86_64-linux
          - os: ubuntu-latest
            target: aarch64-windows-gnu
            asset: hitch-aarch64-windows.exe
          - os: ubuntu-latest
            target: x86_64-windows-gnu
            asset: hitch-x86_64-windows.exe
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: tag matches source version
        run: ./scripts/check-version.sh
      - name: release build
        run: zig build --release=fast -Dtarget=${{ matrix.target }}
      - name: pack binary
        shell: bash
        run: |
          mkdir -p dist
          bin="$(find zig-out/bin -type f \( -name hitch -o -name hitch.exe \) | head -1)"
          test -n "$bin"
          cp "$bin" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x dist/hitch-*
          gh release create "${GITHUB_REF_NAME}" dist/hitch-* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release binaries built from ${GITHUB_SHA}. They are not stored in git." \
            --verify-tag
